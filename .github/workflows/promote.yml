name: promote-test
on: workflow_dispatch
jobs:
  with-github-token:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
        with: { ref: main, fetch-depth: 0 }
      - run: git fetch origin staging && git merge --ff-only origin/staging && git push origin main
  with-deploy-key:
    needs: with-github-token
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: main, fetch-depth: 0, ssh-key: "${{ secrets.PROMOTE_DEPLOY_KEY }}" }
      - run: git fetch origin staging && git merge --ff-only origin/staging && git push origin main
